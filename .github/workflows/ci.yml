name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend / tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ryadom_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ryadom_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RYADOM_TEST_DB: Host=localhost;Port=5432;Database=ryadom_ci;Username=postgres;Password=ci_only_password
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    defaults:
      run:
        working-directory: lab6

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore .NET dependencies
        run: dotnet restore Ryadom.sln
      - name: Build backend and tests
        run: dotnet build Ryadom.sln --configuration Release --no-restore
      - name: Run .NET unit and PostgreSQL integration tests
        run: dotnet test Ryadom.sln --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

  frontend:
    name: Frontend / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lab6/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab6/frontend/package-lock.json
      - name: Install exact npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Angular
        run: npm run build
