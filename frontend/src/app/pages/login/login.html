<main class="min-h-screen bg-[#f8f7f3] px-5 py-12 text-[#202622]">
  <div class="mx-auto max-w-md">
    <a routerLink="/" class="text-sm font-bold text-[#416d61]">← На главную</a>
    <div class="mt-8 rounded-[2rem] bg-white p-8 shadow-[0_20px_55px_rgba(50,65,55,.08)]">
      <div class="mb-5 flex size-12 items-center justify-center rounded-xl bg-[#416d61] text-xl text-white">✦</div>
      <h1 class="text-3xl font-bold">{{ registerMode ? 'Регистрация' : 'Вход в «Рядом»' }}</h1>
      <p class="mt-3 text-sm leading-6 text-[#68706a]">{{ registerMode ? 'Создайте аккаунт, чтобы сохранять результаты и консультации.' : 'Войдите, чтобы открыть личный кабинет и записи.' }}</p>
      <form (ngSubmit)="submit()" class="mt-8 space-y-5">
        <div>
          <label for="username" class="mb-1 block text-sm font-bold">Логин</label>
          <input id="username" name="username" [(ngModel)]="userName" required minlength="3" maxlength="32" pattern="[A-Za-z][A-Za-z0-9_]{2,31}" autocomplete="username"
            class="w-full rounded-xl border border-black/15 bg-white px-4 py-3 outline-none focus:border-[#416d61]" placeholder="Например, ivan123" />
        </div>
        <div>
          <label for="password" class="mb-1 block text-sm font-bold">Пароль</label>
          <input id="password" name="password" [(ngModel)]="password" required minlength="10" maxlength="128" type="password"
            [attr.autocomplete]="registerMode ? 'new-password' : 'current-password'"
            class="w-full rounded-xl border border-black/15 bg-white px-4 py-3 outline-none focus:border-[#416d61]" />
          <p class="mt-1 text-xs text-[#858b87]">Минимум 10 символов, включая буквы и цифры.</p>
        </div>
        @if (error) { <p class="rounded-xl bg-red-50 p-3 text-sm text-red-800" role="alert">{{ error }}</p> }
        <button type="submit" [disabled]="busy" class="w-full rounded-full bg-[#416d61] px-5 py-3.5 font-bold text-white disabled:opacity-50">
          {{ busy ? 'Подождите…' : registerMode ? 'Создать аккаунт' : 'Войти' }}
        </button>
      </form>
      <button type="button" (click)="registerMode = !registerMode; error = ''; password = ''" class="mt-6 w-full text-center text-sm font-bold text-[#416d61]">
        {{ registerMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться' }}
      </button>
    </div>
  </div>
</main>
